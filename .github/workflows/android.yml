name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the phone and watch debug APKs and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Check the database schema is committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::The Room schema changed. Commit app/schemas and add a Migration for the new version."
            git status --porcelain app/schemas
            git diff app/schemas
            git ls-files --others --exclude-standard app/schemas | while read -r f; do echo "== $f"; cat "$f"; echo; done
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload watch debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-app-watch-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
